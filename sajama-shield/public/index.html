<body>
  <div id="app"></div>
  <script>
    const state={authenticated:false,user:null,storage:null,sites:[],selectedSiteId:'site_82be20b5-58ca-412a-998b-6a904a20eda7',siteData:null,errors:[],logs:[],activeTab:'overview',logSeverity:'ALL',authKey:'',loginError:'',runningCheck:false,checkResult:null,showAddSite:false,showOrigins:false,showSnippet:false,originsForm:'',newSiteForm:{site_name:'',site_url:'',allowed_origins:'',category:'E-Commerce & Food Hospitality',environment:'production',sla_target:'99.95'}};

    function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function fmtTime(value,seconds=false){const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{})});}
    function number(value){return value==null||!Number.isFinite(Number(value))?'—':Number(value).toLocaleString('en-US');}
    function statusLabel(status){return({up:'Operational',degraded:'Degraded',down:'Down',unknown:'Awaiting first check'})[status]||'Unknown';}
    async function getJson(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body;}

    async function checkAuth(){try{const result=await getJson('/api/shield/auth/session');state.authenticated=Boolean(result.authenticated);state.user=result.user||null;if(state.authenticated)await loadAllData();}catch{state.authenticated=false;}render();}
    async function login(event){event.preventDefault();state.loginError='';try{const result=await getJson('/api/shield/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:state.authKey,engineer_name:'Administrator'})});state.authenticated=true;state.user=result.user;await loadAllData();}catch(error){state.loginError=error.message||'Unable to sign in.';}render();}
    async function logout(){try{await getJson('/api/shield/auth/logout',{method:'POST'});}catch{}state.authenticated=false;state.user=null;render();}
    async function loadAllData(){try{const [health,siteResult]=await Promise.all([getJson('/api/health'),getJson('/api/shield/sites')]);state.storage=health.storage||null;state.sites=Array.isArray(siteResult.sites)?siteResult.sites:[];if(!state.sites.length){state.selectedSiteId='';state.siteData=null;state.errors=[];state.logs=[];}else{if(!state.sites.some(site=>site.client_id===state.selectedSiteId))state.selectedSiteId=state.sites[0].client_id;const siteId=encodeURIComponent(state.selectedSiteId);const [details,errors,logs]=await Promise.all([getJson('/api/shield/sites/'+siteId),getJson('/api/shield/errors?site_id='+siteId),getJson('/api/shield/logs?site_id='+siteId)]);state.siteData=details;state.errors=Array.isArray(errors.errors)?errors.errors:[];state.logs=Array.isArray(logs.logs)?logs.logs:[];}}catch(error){console.error('Shield data refresh failed:',error);}render();}
    async function refreshSilently(){if(!state.authenticated)return;try{const [health,siteResult]=await Promise.all([getJson('/api/health'),getJson('/api/shield/sites')]);state.storage=health.storage||null;state.sites=Array.isArray(siteResult.sites)?siteResult.sites:[];if(!state.sites.length){state.selectedSiteId='';state.siteData=null;state.errors=[];state.logs=[];}else{if(!state.sites.some(site=>site.client_id===state.selectedSiteId))state.selectedSiteId=state.sites[0].client_id;const siteId=encodeURIComponent(state.selectedSiteId);const [details,errors,logs]=await Promise.all([getJson('/api/shield/sites/'+siteId),getJson('/api/shield/errors?site_id='+siteId),getJson('/api/shield/logs?site_id='+siteId)]);state.siteData=details;state.errors=Array.isArray(errors.errors)?errors.errors:[];state.logs=Array.isArray(logs.logs)?logs.logs:[];}render();}catch(error){console.warn('Shield refresh failed:',error.message);}}
    async function switchSite(value){state.selectedSiteId=value;state.checkResult=null;await loadAllData();}
    async function runCheck(){state.runningCheck=true;state.checkResult=null;render();try{const result=await getJson('/api/shield/diagnose/'+encodeURIComponent(state.selectedSiteId),{method:'POST'});state.checkResult=result.result;await loadAllData();}catch(error){state.checkResult={status:'down',error:error.message};}finally{state.runningCheck=false;render();}}
    function openOrigins(){const site=state.sites.find(entry=>entry.client_id===state.selectedSiteId);if(!site)return;state.originsForm=(site.allowed_origins||[]).join('\n');state.showOrigins=true;render();}
    async function saveOrigins(event){event.preventDefault();try{await getJson('/api/shield/sites/'+encodeURIComponent(state.selectedSiteId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({allowed_origins:state.originsForm})});state.showOrigins=false;await loadAllData();}catch(error){alert(error.message);}}
    async function addSite(event){event.preventDefault();try{const result=await getJson('/api/shield/sites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.newSiteForm)});state.showAddSite=false;state.selectedSiteId=result.site.client_id;state.newSiteForm={site_name:'',site_url:'',allowed_origins:'',category:'E-Commerce & Food Hospitality',environment:'production',sla_target:'99.95'};await loadAllData();}catch(error){alert(error.message);}}
    async function resolveError(id){try{await getJson('/api/shield/errors/'+encodeURIComponent(id)+'/resolve',{method:'POST'});await loadAllData();}catch(error){alert(error.message);}}

    function chartTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
    function renderDurationChart(checks){
      const points=checks.slice(0,24).reverse().map(check=>({check,value:check.latency_ms==null?NaN:Number(check.latency_ms),time:Date.parse(check.checked_at)})).filter(point=>Number.isFinite(point.value)&&point.value>=0&&Number.isFinite(point.time));
      if(!points.length)return `<div class="chart-empty"><span class="chart-empty-mark"><i data-lucide="chart-no-axes-combined"></i></span><div><strong>No check-duration series yet</strong><p>Shield has no completed checks with a measured duration in the retained data. Run a check or wait for the next scheduled request; no values are estimated.</p></div></div>`;
      const W=960,H=300,L=70,R=30,T=22,B=42,plotW=W-L-R,plotH=H-T-B;
      const rawMax=Math.max(...points.map(point=>point.value));
      const step=rawMax<=4?1:rawMax<=20?5:rawMax<=100?25:rawMax<=500?100:rawMax<=1200?250:500;
      const yMax=Math.max(step*4,Math.ceil(rawMax*1.25/step)*step);
      const minTime=points[0].time,maxTime=points[points.length-1].time,timeSpan=maxTime-minTime;
      const coords=points.map((point,index)=>({ ...point, x:L+(timeSpan>0?(point.time-minTime)/timeSpan:(points.length===1?.5:index/(points.length-1)))*plotW, y:T+plotH-(point.value/yMax)*plotH }));
      const ticks=Array.from({length:5},(_,index)=>index*yMax/4);
      const grid=ticks.map(value=>{const y=T+plotH-(value/yMax)*plotH;return `<line class="grid-line" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis-text" x="${L-10}" y="${y+3}" text-anchor="end">${Math.round(value)} ms</text>`;}).join('');
      const area=coords.length>1?`<polygon class="series-area" points="${coords[0].x},${T+plotH} ${coords.map(point=>`${point.x},${point.y}`).join(' ')} ${coords[coords.length-1].x},${T+plotH}"/>`:'';
      const line=coords.length>1?`<polyline class="series-line" points="${coords.map(point=>`${point.x},${point.y}`).join(' ')}"/>`:'';
      const dots=coords.map((point,index)=>{const status=['up','degraded','down'].includes(point.check.status)?point.check.status:'unknown';const description=`${statusLabel(status)} · ${fmtTime(point.check.checked_at,true)} · ${Math.round(point.value)} ms${point.check.http_status==null?' · no HTTP response':` · HTTP ${point.check.http_status}`}`;return `<circle class="series-dot is-${status}" cx="${point.x}" cy="${point.y}" r="${index===coords.length-1?'7':'5'}" tabindex="0"><title>${escapeHtml(description)}</title></circle>`;}).join('');
      const latest=coords[coords.length-1],labelAnchor=latest.x>W-R-75?'end':'start',labelX=latest.x>W-R-75?latest.x-11:latest.x+11,labelY=Math.max(T+14,latest.y-12);
      const latestLabel=`<text class="point-value" x="${labelX}" y="${labelY}" text-anchor="${labelAnchor}">${Math.round(latest.value)} ms</text>`;
      const first=chartTime(points[0].check.checked_at),last=chartTime(points[points.length-1].check.checked_at);
      const desc=`Measured probe duration for ${points.length} completed checks, from ${first} to ${last}. Failed checks show elapsed time to failure, not an HTTP response time.`;
      return `<svg class="duration-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(desc)}"><defs><linearGradient id="duration-area-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#70877a" stop-opacity=".23"/><stop offset="100%" stop-color="#70877a" stop-opacity=".025"/></linearGradient></defs><title>Measured duration of recent checks</title><desc>${escapeHtml(desc)}</desc>${grid}${area}${line}${dots}${latestLabel}<text class="axis-text" x="${L}" y="${H-8}" text-anchor="start">${escapeHtml(first)}</text><text class="axis-text" x="${W-R}" y="${H-8}" text-anchor="end">${escapeHtml(last)}</text></svg>`;
    }

    function renderTimeline(checks){
      const items=checks.slice(0,24).reverse();
      if(!items.length)return `<div class="timeline-empty"><i data-lucide="clock-3"></i><div><strong>No completed checks yet</strong><p>The first mark appears after a real HTTP request completes.</p></div><button class="section-action" type="button" onclick="runCheck()">Run first check <i data-lucide="arrow-right"></i></button></div>`;
      const marks=items.map(check=>{const status=['up','degraded','down'].includes(check.status)?check.status:'unknown';const label=`${statusLabel(status)} · ${fmtTime(check.checked_at,true)} · ${check.http_status==null?'no HTTP response':`HTTP ${check.http_status}`} · ${check.latency_ms==null?'duration unavailable':`${check.latency_ms} ms`}`;return `<span class="check-mark is-${status}" role="listitem" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}"></span>`;}).join('');
      return `<div class="check-strip" role="list" aria-label="${items.length} latest completed checks">${marks}</div><div class="strip-labels"><span>Oldest shown · ${escapeHtml(fmtTime(items[0].checked_at))}</span><span>Newest · ${escapeHtml(fmtTime(items[items.length-1].checked_at))}</span></div>`;
    }

    const VITAL_DEFS=[
      {key:'ttfb',label:'Time to first byte',valueKey:'value_ms',good:800,poor:1800,unit:'ms'},
      {key:'fcp',label:'First contentful paint',valueKey:'value_ms',good:1800,poor:3000,unit:'ms'},
      {key:'lcp',label:'Largest contentful paint',valueKey:'value_ms',good:2500,poor:4000,unit:'ms'},
      {key:'cls',label:'Cumulative layout shift',valueKey:'value',good:.1,poor:.25,unit:''},
      {key:'inp',label:'Interaction to next paint',valueKey:'value_ms',good:200,poor:500,unit:'ms'},
    ];
    function formatVital(value,definition){if(value==null||!Number.isFinite(Number(value)))return '—';const n=Number(value);if(definition.key==='fcp'||definition.key==='lcp')return `${(n/1000).toFixed(2)} s`;if(definition.key==='cls')return n.toFixed(3);return `${Math.round(n)} ms`;}
    function renderVitalsBars(siteData,compact=false){
      const vitals=siteData?.web_vitals||{};const hasData=VITAL_DEFS.some(def=>Number(vitals[def.key]?.sample_count)>0&&vitals[def.key]?.[def.valueKey]!=null);
      if(!hasData)return `<div class="empty-state"><span class="empty-icon"><i data-lucide="scan-eye"></i></span><div><strong>No real-user measurements yet</strong><p>Performance values appear after the installed browser tag sends real page-load data. No sample series is shown while data is unavailable.</p><button type="button" class="section-action" onclick="state.showSnippet=true;render()">Install browser tag <i data-lucide="arrow-right"></i></button></div></div>`;
      const rows=VITAL_DEFS.map(def=>{const metric=vitals[def.key]||{};const value=metric[def.valueKey];const count=Number(metric.sample_count)||0;if(value==null||!Number.isFinite(Number(value))||!count)return `<div class="vital-bar-row"><div class="vital-bar-label"><strong>${def.label}</strong><small>No samples</small></div><div class="vital-bar-track" aria-hidden="true"></div><div class="vital-bar-value"><strong>—</strong><small>no data</small></div></div>`;const max=def.poor*1.25;const goodPoint=def.good/max*100;const poorPoint=def.poor/max*100;const valuePoint=Math.min(100,Math.max(0,Number(value)/max*100));const status=metric.status==='good'?'good':metric.status==='poor'?'poor':metric.status==='needs improvement'?'warning':'unknown';const title=`75th percentile ${formatVital(value,def)} from ${count} samples · good ≤ ${def.key==='fcp'||def.key==='lcp'?`${(def.good/1000).toFixed(1)} s`:def.key==='cls'?def.good:`${def.good} ms`} · poor above ${def.key==='fcp'||def.key==='lcp'?`${(def.poor/1000).toFixed(1)} s`:def.key==='cls'?def.poor:`${def.poor} ms`}`;return `<div class="vital-bar-row"><div class="vital-bar-label"><strong>${def.label}</strong><small>p75 · ${count.toLocaleString('en-US')} samples</small></div><div class="vital-bar-track is-${status}" style="--good-point:${goodPoint}%;--poor-point:${poorPoint}%;--value-point:${valuePoint}%" role="meter" aria-label="${escapeHtml(def.label)} 75th percentile" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${Number(value)}" aria-valuetext="${escapeHtml(title)}" title="${escapeHtml(title)}"><span class="vital-bar-marker"></span></div><div class="vital-bar-value"><strong>${formatVital(value,def)}</strong><small>${escapeHtml(metric.status||'')}</small></div></div>`;}).join('');
      return `<div class="vital-bars">${rows}</div><div class="vital-legend"><span><i></i>Good</span><span><i class="warn"></i>Needs improvement</span><span><i class="poor"></i>Poor</span></div><p class="vitals-note">Markers show the measured 75th percentile. Background bands use the assessment thresholds; values are aggregated only from real browser samples received in the last 24 hours.</p>`;
    }

    function pageHeading(site){
      const title={overview:'Overview',uptime:'Uptime',performance:'Performance',errors:'Errors',activity:'Activity'}[state.activeTab]||'Overview';
      const description={overview:'Availability, probe duration, and performance reported by real visitors.',uptime:'Actual HTTP requests made from this Shield server on a 60-second schedule.',performance:'Real-browser performance measurements received from the Shield tag.',errors:'JavaScript errors reported by browsers running the Shield tag.',activity:'Status changes and telemetry events actually received by Shield.'}[state.activeTab]||'';
      const status=site?.status||'unknown';const last=site?.last_checked_at?fmtTime(site.last_checked_at):'No completed check';
      const environment=site?.environment?`<span><i data-lucide="layers-2"></i>${escapeHtml(site.environment)}</span><i class="separator"></i>`:'';
      const url=site?.site_url?`<a href="${escapeHtml(site.site_url)}" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link"></i>${escapeHtml(site.site_url)}</a>`:`<span><i data-lucide="globe-2"></i>No target URL</span>`;
      return `<section class="page-context"><div class="breadcrumb"><span>Monitoring</span><i data-lucide="chevron-right"></i><strong>${escapeHtml(site?.site_name||'No website configured')}</strong></div><div class="page-heading"><div><div class="page-kicker"><i></i> WEBSITE MONITOR</div><h1>${title}</h1><p>${description}</p></div><div class="page-state"><span class="state-pill is-${escapeHtml(status)}"><i class="dot"></i>${statusLabel(status)}</span><span class="last-check"><small>LAST CHECK</small><strong>${escapeHtml(last)}</strong></span></div></div><div class="site-meta">${url}${environment}<span><i data-lucide="timer"></i>Scheduled every 60 seconds</span></div></section>`;
    }

    function renderOverview(site,data){
      const checks=Array.isArray(data?.check_history)?data.check_history:[];const stats={...site};
      const avail=stats.uptime_percentage==null?'—':`${Number(stats.uptime_percentage).toFixed(2)}%`;
      const avg=stats.avg_latency_ms==null?'—':`${number(stats.avg_latency_ms)} ms`;
      const failed=Number(stats.failed_checks_24h)||0;const degraded=Number(stats.degraded_checks_24h)||0;
      const metrics=[['Availability',avail,stats.checks_24h?`${failed} down · ${degraded} degraded`:'No checks recorded in the last 24 hours','24H'],['Avg response',avg,stats.p95_latency_ms==null?'No HTTP response samples':`p95 ${number(stats.p95_latency_ms)} ms`,'24H'],['HTTP checks',number(stats.checks_24h||0),stats.last_checked_at?`Last ${fmtTime(stats.last_checked_at)}`:'No completed check','24H'],['Active sessions',number(stats.active_sessions_5m||0),stats.last_telemetry_at?`${number(stats.pageviews_24h||0)} pageviews · last event ${fmtTime(stats.last_telemetry_at)}`:'Waiting for browser tag data','5 MIN']];
      const metricHtml=metrics.map(([label,value,note,window])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span class="metric-window">${window}</span></div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`).join('');
      const logRows=state.logs.slice(0,5).map(log=>{const severity=String(log.severity||'INFO').toLowerCase();const klass=severity==='error'?'error':severity==='warn'?'warn':'info';return `<tr><td>${escapeHtml(fmtTime(log.logged_at,true))}</td><td><span class="severity-tag ${klass}">${escapeHtml(log.severity||'INFO')}</span></td><td class="event">${escapeHtml(log.message)}</td></tr>`;}).join('');
      const timeline=renderTimeline(checks);
      const recentPlottedCount=checks.slice(0,24).filter(check=>check.latency_ms!=null&&Number.isFinite(Number(check.latency_ms))&&Number.isFinite(Date.parse(check.checked_at))).length;
      const chart=renderDurationChart(checks);
      return `<div class="content-stack"><section class="monitoring-visual"><div class="visual-header"><div class="visual-title-wrap"><span class="section-eyebrow">MEASURED CHECK DATA</span><h2>Check duration</h2><p>Elapsed time for the most recent completed checks. Failed checks show time to failure, not an HTTP response time.</p></div><div class="visual-header-action"><span class="chart-sample-count">${recentPlottedCount} plotted checks</span></div></div>${chart}<div class="chart-legend"><span><i></i>Operational</span><span><i class="is-degraded"></i>Degraded</span><span><i class="is-down"></i>Down</span></div><p class="chart-footnote">Points and timestamps come from actual requests made by this Shield instance. No interpolation or synthetic points.</p><div class="visual-divider"></div><div class="history-heading"><div><strong>Availability history</strong><small>Latest completed checks · newest at right</small></div><button type="button" onclick="state.activeTab='uptime';render()" class="section-action">Full history <i data-lucide="arrow-right"></i></button></div>${timeline}</section><section class="metric-rail" aria-label="Measured monitoring summary">${metricHtml}</section><div class="overview-columns"><section class="data-panel"><div class="panel-header"><div><span class="section-eyebrow">REAL VISITOR DATA · 24H</span><h2>Browser performance</h2><p>75th percentile from received browser samples; not a synthetic lab test.</p></div><button type="button" onclick="state.activeTab='performance';render()" class="section-action">Details <i data-lucide="arrow-right"></i></button></div>${renderVitalsBars(data,true)}</section><section class="data-panel"><div class="panel-header"><div><span class="section-eyebrow">CONFIGURATION</span><h2>Monitored website</h2><p>The target and browser origins configured for this monitor.</p></div><button type="button" onclick="openOrigins()" class="section-action">Origins</button></div><div class="detail-grid"><div><div class="detail-label">Target URL</div><div class="detail-value"><a href="${escapeHtml(site.site_url||'#')}" target="_blank" rel="noopener noreferrer">${escapeHtml(site.site_url||'Not set')}</a></div></div><div><div class="detail-label">Environment</div><div class="detail-value">${escapeHtml(site.environment||'Not set')}</div></div><div><div class="detail-label">Allowed origins</div><div class="detail-value">${Array.isArray(site.allowed_origins)?site.allowed_origins.length:0}</div></div><div><div class="detail-label">Latest HTTP response</div><div class="detail-value">${site.last_http_status==null?'—':escapeHtml(site.last_http_status)}</div></div></div><div class="detail-footer"><a class="section-action" href="/status/${encodeURIComponent(site.client_id)}" target="_blank" rel="noopener noreferrer">Public status page <i data-lucide="external-link"></i></a></div></section></div><section class="activity-panel"><div class="panel-header"><div><span class="section-eyebrow">MONITOR EVENTS</span><h2>Recent activity</h2><p>Status changes and telemetry events actually received from this site.</p></div><button type="button" onclick="state.activeTab='activity';render()" class="section-action">All activity <i data-lucide="arrow-right"></i></button></div>${logRows?`<div class="table-wrap"><table class="activity-table"><thead><tr><th>Time</th><th>Level</th><th>Event</th></tr></thead><tbody>${logRows}</tbody></table></div>`:`<div class="empty-state"><span class="empty-icon"><i data-lucide="list-checks"></i></span><div><strong>No recent events</strong><p>Events will appear after actual status changes or telemetry arrive.</p></div></div>`}</section></div>`;
    }

    function renderUptime(site,data){const checks=Array.isArray(data?.check_history)?data.check_history:[];const rows=checks.map(check=>`<tr><td>${escapeHtml(fmtTime(check.checked_at,true))}</td><td><span class="status-tag ${escapeHtml(check.status)}">${escapeHtml(statusLabel(check.status))}</span></td><td>${check.http_status==null?'—':escapeHtml(check.http_status)}</td><td>${check.latency_ms==null?'—':`${escapeHtml(check.latency_ms)} ms`}</td><td>${escapeHtml(check.error||'—')}</td></tr>`).join('');const plotted=checks.slice(0,24).filter(check=>check.latency_ms!=null&&Number.isFinite(Number(check.latency_ms))&&Number.isFinite(Date.parse(check.checked_at))).length;return `<section class="full-panel"><div class="panel-header"><div><span class="section-eyebrow">SERVER-SIDE MONITORING</span><h2>HTTP check history</h2><p>GET requests from this Shield server to ${escapeHtml(site.site_url)} every 60 seconds. This is one monitoring location.</p></div><span class="panel-count">${checks.length} recent results</span></div><section class="monitoring-visual uptime-visual"><div class="visual-header"><div class="visual-title-wrap"><span class="section-eyebrow">MEASURED PROBE DURATION</span><h2>Latest request timings</h2><p>Each point is a real request. Failed checks show elapsed time to failure.</p></div><span class="chart-sample-count">${plotted} plotted checks</span></div>${renderDurationChart(checks)}<div class="chart-legend"><span><i></i>Operational</span><span><i class="is-degraded"></i>Degraded</span><span><i class="is-down"></i>Down</span></div><p class="chart-footnote">No interpolation or synthetic points. Hover or focus a point to inspect its HTTP result and measured duration.</p><div class="visual-divider"></div><div class="history-heading"><div><strong>Availability history</strong><small>Latest completed checks · newest at right</small></div></div>${renderTimeline(checks)}</section>${rows?`<div class="table-wrap"><table class="activity-table"><thead><tr><th>Checked at</th><th>Status</th><th>HTTP</th><th>Probe duration</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty-state"><span class="empty-icon"><i data-lucide="activity"></i></span><div><strong>No completed checks yet</strong><p>Run the first check or wait for the scheduled request.</p></div></div>`}</section>`;}
    function renderPerformance(site,data){const sampleCount=Number(site.rum_samples_24h)||0;return `<section class="full-panel"><div class="panel-header"><div><span class="section-eyebrow">REAL USER MONITORING</span><h2>Browser performance</h2><p>75th percentile of Web Vitals received from real browser sessions in the last 24 hours.</p></div><span class="panel-count">${sampleCount.toLocaleString('en-US')} performance samples</span></div>${renderVitalsBars(data,false)}</section>`;}
    function renderErrors(site){const unresolved=state.errors.filter(error=>error.status!=='resolved').length;const rows=state.errors.length?state.errors.map(error=>{const resolved=error.status==='resolved';return `<article class="error-row"><div class="error-main"><div class="error-meta"><span class="error-type ${resolved?'resolved':''}">${escapeHtml(error.error_type||'Browser error')}</span><span class="error-location">${escapeHtml(error.filename||'Unknown file')}${error.lineno?`:${escapeHtml(error.lineno)}`:''}</span><span class="panel-count">${escapeHtml(error.occurrences||0)} occurrences</span></div><h3>${escapeHtml(error.message||'No message')}</h3><p>Last seen ${escapeHtml(fmtTime(error.last_seen,true))}</p></div><div class="error-action">${resolved?'<span class="status-tag up">Resolved</span>':`<button type="button" class="button" onclick="resolveError('${escapeHtml(error.id)}')">Mark resolved</button>`}</div></article>`;}).join(''):`<div class="empty-state"><span class="empty-icon"><i data-lucide="${site.last_telemetry_at?'circle-check':'scan-eye'}"></i></span><div><strong>${site.last_telemetry_at?'No unresolved browser errors':'Browser tag data has not arrived'}</strong><p>${site.last_telemetry_at?'No unresolved errors are present in retained telemetry.':'Install the Shield tag to receive real page views, performance measurements, and browser errors.'}</p>${site.last_telemetry_at?'':'<button type="button" class="section-action" onclick="state.showSnippet=true;render()">Install browser tag <i data-lucide="arrow-right"></i></button>'}</div></div>`;return `<section><div class="error-heading"><div><span class="section-eyebrow">BROWSER TELEMETRY</span><h2>JavaScript errors</h2><p>Grouped error events reported by the installed Shield tag.</p></div><span class="panel-count">${unresolved} unresolved · ${state.errors.length} recorded</span></div><div class="error-list">${rows}</div></section>`;}
    function renderActivity(){const visible=state.logs.filter(log=>state.logSeverity==='ALL'||log.severity===state.logSeverity);const rows=visible.map(log=>{const severity=String(log.severity||'INFO').toLowerCase();const klass=severity==='critical'?'critical':severity==='error'?'error':severity==='warn'?'warn':'info';return `<tr><td>${escapeHtml(fmtTime(log.logged_at,true))}</td><td><span class="severity-tag ${klass}">${escapeHtml(log.severity||'INFO')}</span></td><td>${escapeHtml(log.subsystem||'—')}</td><td class="event">${escapeHtml(log.message)}</td></tr>`;}).join('');return `<section class="activity-panel"><div class="panel-header"><div><span class="section-eyebrow">MONITOR EVENTS</span><h2>Activity log</h2><p>Events generated by real checks and browser telemetry.</p></div><select class="filter-select" aria-label="Filter event severity" onchange="state.logSeverity=this.value;render()"><option value="ALL" ${state.logSeverity==='ALL'?'selected':''}>All levels</option><option value="INFO" ${state.logSeverity==='INFO'?'selected':''}>Info</option><option value="WARN" ${state.logSeverity==='WARN'?'selected':''}>Warning</option><option value="ERROR" ${state.logSeverity==='ERROR'?'selected':''}>Error</option></select></div>${rows?`<div class="table-wrap"><table class="activity-table"><thead><tr><th>Time</th><th>Level</th><th>Source</th><th>Event</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty-state"><span class="empty-icon"><i data-lucide="list-filter"></i></span><div><strong>No events match this filter</strong><p>Try another severity or wait for the next actual monitor event.</p></div></div>`}</section>`;}

    function renderNoSites(){return `<section class="no-sites"><span class="section-eyebrow">SET UP YOUR FIRST MONITOR</span><h2>Bring a website into Shield</h2><p>Add the target URL you want checked. Shield will make a real HTTP request every 60 seconds. Install the browser tag separately to collect real-visitor performance and error data.</p><button type="button" class="button primary" onclick="state.showAddSite=true;render()"><i data-lucide="plus"></i>Add your first website</button><div class="no-sites-steps"><div class="no-sites-step"><b>01</b><div><strong>Add target URL</strong><small>Choose the website Shield should request.</small></div></div><div class="no-sites-step"><b>02</b><div><strong>Review actual checks</strong><small>See availability and probe duration from Shield.</small></div></div><div class="no-sites-step"><b>03</b><div><strong>Connect browser data</strong><small>Install the tag for real-user measurements.</small></div></div></div></section>`;}

    function modalAdd(){return `<div class="modal-backdrop" onclick="if(event.target===this){state.showAddSite=false;render()}"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="add-site-title"><button class="modal-close" aria-label="Close dialog" onclick="state.showAddSite=false;render()"><i data-lucide="x"></i></button><h2 id="add-site-title">Add a website</h2><p class="modal-intro">Register a target for real HTTP checks and optional browser telemetry.</p><form onsubmit="addSite(event)"><div class="form-field"><label class="field-label" for="new-site-name">Website name</label><input class="input" id="new-site-name" required value="${escapeHtml(state.newSiteForm.site_name)}" oninput="state.newSiteForm.site_name=this.value" placeholder="e.g. Mayford Foods GH" /></div><div class="form-field"><label class="field-label" for="new-site-url">Target URL</label><input class="input" id="new-site-url" type="url" required value="${escapeHtml(state.newSiteForm.site_url)}" oninput="state.newSiteForm.site_url=this.value" placeholder="https://example.com" /></div><div class="form-field"><label class="field-label" for="new-site-origins">Additional browser origins <span style="font-weight:400;color:#89948d">(optional)</span></label><textarea class="textarea" id="new-site-origins" rows="3" oninput="state.newSiteForm.allowed_origins=this.value" placeholder="https://www.example.com&#10;https://staging.example.com">${escapeHtml(state.newSiteForm.allowed_origins)}</textarea><p class="field-help">The target URL origin is added automatically. Use complete origins with no path.</p></div><div class="form-grid"><div class="form-field"><label class="field-label" for="new-site-env">Environment</label><select class="input" id="new-site-env" onchange="state.newSiteForm.environment=this.value"><option value="production">Production</option><option value="staging">Staging</option><option value="development">Development</option></select></div><div class="form-field"><label class="field-label" for="new-site-sla">SLA target (%)</label><input class="input" id="new-site-sla" type="number" min="0" max="100" step="0.01" value="${escapeHtml(state.newSiteForm.sla_target)}" oninput="state.newSiteForm.sla_target=this.value" /></div></div><div class="modal-actions"><button type="button" class="button" onclick="state.showAddSite=false;render()">Cancel</button><button type="submit" class="button primary">Add website</button></div></form></section></div>`;}
    function modalOrigins(site){return `<div class="modal-backdrop" onclick="if(event.target===this){state.showOrigins=false;render()}"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="origins-title"><button class="modal-close" aria-label="Close dialog" onclick="state.showOrigins=false;render()"><i data-lucide="x"></i></button><h2 id="origins-title">Allowed browser origins</h2><p class="modal-intro">Allow exact website origins to send browser telemetry for ${escapeHtml(site.site_name)}. The target origin is always included.</p><form onsubmit="saveOrigins(event)"><div class="form-field"><label class="field-label" for="origin-list">One origin per line</label><textarea class="textarea" id="origin-list" rows="6" spellcheck="false" oninput="state.originsForm=this.value">${escapeHtml(state.originsForm)}</textarea><p class="field-help">Origin changes apply immediately. No Mayford-side proxy is used; browsers post directly to Shield.</p></div><div class="modal-actions"><button type="button" class="button" onclick="state.showOrigins=false;render()">Cancel</button><button type="submit" class="button primary">Save origins</button></div></form></section></div>`;}
    function modalSnippet(site){const code=`<script src="${window.location.origin}/sajama-tag.js" data-site-id="${site.client_id}" async></scr${'ipt>'}`;return `<div class="modal-backdrop" onclick="if(event.target===this){state.showSnippet=false;render()}"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="snippet-title"><button class="modal-close" aria-label="Close dialog" onclick="state.showSnippet=false;render()"><i data-lucide="x"></i></button><h2 id="snippet-title">Install the Shield browser tag</h2><p class="modal-intro">Add the script to your site. It reports real page views, browser performance, and JavaScript errors directly to Shield.</p><div class="snippet"><code>${escapeHtml(code)}</code></div><p class="modal-note">Site ID ${escapeHtml(site.client_id)} is a public identifier, not a secret. Do not place the Shield key in browser code.</p><div class="modal-actions"><button type="button" class="button" onclick="navigator.clipboard?.writeText(${JSON.stringify(code).replace(/</g,'\\u003c')}).then(()=>alert('Tag copied')).catch(()=>{})">Copy snippet</button><button type="button" class="button primary" onclick="state.showSnippet=false;render()">Done</button></div></section></div>`;}

    function render(){const root=document.getElementById('app');if(!state.authenticated){root.innerHTML=`<main class="login-shell"><section class="login-panel"><div class="login-mark"><i data-lucide="shield-check"></i></div><h1>Sajama Shield</h1><p class="login-copy">Sign in to review actual website checks and browser measurements.</p>${state.loginError?`<div class="login-error" role="alert">${escapeHtml(state.loginError)}</div>`:''}<form onsubmit="login(event)"><label class="field-label" for="shield-key">Shield key</label><input class="input" id="shield-key" type="password" required autocomplete="current-password" placeholder="Enter your Shield key" value="${escapeHtml(state.authKey)}" oninput="state.authKey=this.value" /><p class="field-help">Use the key set by your Shield administrator.</p><button type="submit" class="button primary">Sign in <i data-lucide="arrow-right"></i></button></form><div class="login-foot">Secure access to your monitoring workspace</div></section></main>`;lucide.createIcons();return;}
      const site=state.sites.find(item=>item.client_id===state.selectedSiteId)||state.sites[0]||{site_name:'No website configured',site_url:'',client_id:state.selectedSiteId,status:'unknown'};const data=state.siteData||{};const unresolved=state.errors.filter(error=>error.status!=='resolved').length;const userName=String(state.user?.engineer||'Administrator');const initial=userName.trim().charAt(0).toUpperCase()||'S';
      const tabs=[['overview','Overview','layout-dashboard'],['uptime','Uptime','activity'],['performance','Performance','gauge'],['errors','Errors','bug'],['activity','Activity','list']];
      const tabHtml=tabs.map(([id,label,icon])=>`<button type="button" class="nav-item" aria-current="${state.activeTab===id?'page':'false'}" onclick="state.activeTab='${id}';render()"><i data-lucide="${icon}"></i><span>${label}</span>${id==='errors'&&unresolved?`<span class="nav-badge">${unresolved}</span>`:''}</button>`).join('');
      let content='';if(!state.sites.length)content=renderNoSites();else if(state.activeTab==='uptime')content=renderUptime(site,data);else if(state.activeTab==='performance')content=renderPerformance(site,data);else if(state.activeTab==='errors')content=renderErrors(site);else if(state.activeTab==='activity')content=renderActivity();else content=renderOverview(site,data);
      const alert=state.checkResult?`<div class="check-result"><strong>${escapeHtml(state.checkResult.site_name||site.site_name)}: ${escapeHtml(statusLabel(state.checkResult.status))}</strong><span>${state.checkResult.http_status==null?escapeHtml(state.checkResult.error||'No HTTP response'):`HTTP ${escapeHtml(state.checkResult.http_status)}`}</span><span>${state.checkResult.latency_ms==null?'—':`${escapeHtml(state.checkResult.latency_ms)} ms`}</span></div>`:'';
      root.innerHTML=`<header class="app-header"><div class="app-topbar"><div class="brand"><span class="brand-mark"><i data-lucide="shield-check"></i></span><span><strong class="brand-name">Sajama Shield</strong><small class="brand-caption">Website reliability</small></span></div><div class="site-picker"><div class="site-picker-field"><label class="site-picker-label" for="site-select">MONITORED SITE</label><div class="site-select-wrap"><i data-lucide="globe-2"></i><select class="site-select" id="site-select" onchange="switchSite(this.value)" ${state.sites.length?'':'disabled'}>${state.sites.length?state.sites.map(item=>`<option value="${escapeHtml(item.client_id)}" ${item.client_id===state.selectedSiteId?'selected':''}>${escapeHtml(item.site_name)}</option>`).join(''):'<option>No websites added</option>'}</select><i class="chevron" data-lucide="chevron-down"></i></div></div><button type="button" class="button" onclick="state.showAddSite=true;render()"><i data-lucide="plus"></i><span>Add site</span></button></div><div class="header-actions"><button type="button" class="button install-tag" onclick="state.showSnippet=true;render()" ${state.sites.length?'':'disabled'}><i data-lucide="code-2"></i><span>Install tag</span></button><button type="button" class="button primary" onclick="runCheck()" ${state.runningCheck||!state.sites.length?'disabled':''}><i data-lucide="${state.runningCheck?'loader-circle':'refresh-cw'}" class="${state.runningCheck?'spin':''}"></i><span>${state.runningCheck?'Checking…':'Check now'}</span></button><div class="profile"><span class="avatar">${escapeHtml(initial)}</span><span class="profile-copy"><strong>${escapeHtml(userName)}</strong><small>Shield administrator</small></span><button type="button" class="icon-button" title="Sign out" aria-label="Sign out" onclick="logout()"><i data-lucide="log-out"></i></button></div></div></div></header><div class="app-layout"><aside class="sidebar"><div class="workspace-card"><span class="workspace-icon"><i data-lucide="layers-3"></i></span><span class="workspace-copy"><small>WORKSPACE</small><strong>Shield monitoring</strong></span><span class="site-count">${state.sites.length}</span></div><div class="nav-heading">MONITOR</div><nav class="nav-list" aria-label="Monitoring sections">${tabHtml}</nav><div class="sidebar-footer"><span class="sidebar-footer-icon"><i data-lucide="database"></i></span><span class="sidebar-footer-copy"><small>Storage</small><strong>${state.storage?.backend==='supabase'?(state.storage.connected?(state.storage.pending_writes?`Supabase · ${number(state.storage.pending_writes)} writes pending`:'Supabase connected'):'Supabase disconnected'):state.storage?.backend==='json'?'Local JSON · cloud inactive':'Storage status unavailable'}</strong><small>Checks every 60 seconds</small></span></div></aside><main class="main-pane"><section class="page-context"><div class="breadcrumb"><span>Monitoring</span><i data-lucide="chevron-right"></i><strong>${escapeHtml(site.site_name)}</strong></div><div class="page-heading"><div><div class="page-kicker"><i></i> WEBSITE MONITOR</div><h1>${{overview:'Overview',uptime:'Uptime',performance:'Performance',errors:'Errors',activity:'Activity'}[state.activeTab]||'Overview'}</h1><p>${{overview:'Availability, probe duration, and measurements reported by real visitors.',uptime:'Actual HTTP requests made from this Shield server on a 60-second schedule.',performance:'Real-browser performance measurements received from the Shield tag.',errors:'JavaScript errors reported by browsers running the Shield tag.',activity:'Status changes and telemetry events actually received by Shield.'}[state.activeTab]||''}</p></div><div class="page-state"><span class="state-pill is-${escapeHtml(site.status||'unknown')}"><i class="dot"></i>${statusLabel(site.status||'unknown')}</span><span class="last-check"><small>LAST CHECK</small><strong>${escapeHtml(site.last_checked_at?fmtTime(site.last_checked_at):'No completed check')}</strong></span></div></div><div class="site-meta">${site.site_url?`<a href="${escapeHtml(site.site_url)}" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link"></i>${escapeHtml(site.site_url)}</a>`:'<span><i data-lucide="globe-2"></i>No target URL</span>'}${site.environment?`<i class="separator"></i><span><i data-lucide="layers-2"></i>${escapeHtml(site.environment)}</span>`:''}<i class="separator"></i><span><i data-lucide="timer"></i>Scheduled every 60 seconds</span></div></section>${alert}${state.sites.length?content:content}</main></div>${state.showAddSite?modalAdd():''}${state.showOrigins?modalOrigins(site):''}${state.showSnippet&&state.sites.length?modalSnippet(site):''}`;
      lucide.createIcons();
    }

    setInterval(()=>{if(state.authenticated)void refreshSilently();},15000);
    checkAuth();
  </script>
</body>
</html>
