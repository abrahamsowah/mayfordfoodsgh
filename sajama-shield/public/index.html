<!DOCTYPE html>
<html lang="en" class="h-full bg-[#090B10]">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sajama Shield | Mission Control & Autonomous Observability SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            panel: '#11151F',
            panelBorder: '#232B3E',
            panelHeader: '#161B26',
            brandGold: '#F59E0B',
            alertGreen: '#10B981',
            alertAmber: '#F59E0B',
            alertRed: '#F43F5E',
            alertBlue: '#3B82F6',
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-card { border: 1px solid #d1d5db !important; box-shadow: none !important; background: white !important; color: black !important; }
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #090B10; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #232B3E; border-radius: 2px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #333E59; }
  </style>
</head>
<body class="h-full text-slate-100 font-sans antialiased bg-[#090B10] custom-scroll selection:bg-amber-500 selection:text-slate-950">
  <div id="app" class="min-h-full flex flex-col"></div>

  <script>
    const state = {
      authenticated: false,
      user: null,
      activeTab: 'mission_control', // 'mission_control' | 'security' | 'vitals' | 'errors' | 'funnels' | 'reports' | 'logs'
      sites: [],
      probeNodes: [],
      selectedSiteId: 'site_mayford_gh_001',
      siteData: null,
      executiveReport: null,
      errors: [],
      logs: [],
      logSeverity: 'ALL',
      logSearch: '',
      runningDiag: false,
      diagResult: null,
      authKey: 'sajama2026',
      engineerName: 'Senior DevOps Architect',
      loginError: '',
      showAddSiteModal: false,
      showSnippetModal: false,
      currentTime: new Date().toISOString(),
      newSiteForm: {
        site_name: '',
        site_url: '',
        category: 'E-Commerce & Food Hospitality',
        environment: 'production',
        sla_target: '99.95',
        alert_email: ''
      }
    };

    async function init() {
      await checkAuth();
      setInterval(() => {
        state.currentTime = new Date().toISOString();
        const timeEl = document.getElementById('utc-clock');
        if (timeEl) timeEl.innerText = new Date().toUTCString().replace('GMT', 'UTC');
      }, 1000);

      setInterval(() => {
        if (state.authenticated) {
          refreshSiteDataSilent();
        }
      }, 15000);
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/shield/auth/session').then(r => r.json());
        state.authenticated = res.authenticated;
        state.user = res.user;
        if (state.authenticated) {
          await loadAllData();
        }
      } catch (e) {
        state.authenticated = false;
      }
      render();
    }

    async function login(e) {
      if (e) e.preventDefault();
      try {
        const res = await fetch('/api/shield/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: state.authKey, engineer_name: state.engineerName })
        }).then(r => r.json());

        if (res.ok) {
          state.authenticated = true;
          state.user = res.user;
          state.loginError = '';
          await loadAllData();
        } else {
          state.loginError = res.error || 'Invalid Master Key';
        }
      } catch (err) {
        state.loginError = 'Unable to connect to Shield API server';
      }
      render();
    }

    async function logout() {
      await fetch('/api/shield/auth/logout', { method: 'POST' });
      state.authenticated = false;
      state.user = null;
      render();
    }

    async function loadAllData() {
      try {
        const [sitesRes, siteRes, reportRes, errorsRes, logsRes] = await Promise.all([
          fetch('/api/shield/sites').then(r => r.json()),
          fetch('/api/shield/sites/' + state.selectedSiteId).then(r => r.json()),
          fetch('/api/shield/reports/' + state.selectedSiteId).then(r => r.json()),
          fetch('/api/shield/errors?site_id=' + state.selectedSiteId).then(r => r.json()),
          fetch('/api/shield/logs?site_id=' + state.selectedSiteId).then(r => r.json())
        ]);
        if (sitesRes.sites) state.sites = sitesRes.sites;
        if (sitesRes.probe_nodes) state.probeNodes = sitesRes.probe_nodes;
        if (siteRes.ok) {
          state.siteData = siteRes;
          if (siteRes.probe_nodes) state.probeNodes = siteRes.probe_nodes;
        }
        if (reportRes.ok) state.executiveReport = reportRes.report;
        if (errorsRes.errors) state.errors = errorsRes.errors;
        if (logsRes.logs) state.logs = logsRes.logs;
      } catch (err) {
        console.error('Error loading Shield telemetry:', err);
      }
      render();
    }

    async function refreshSiteDataSilent() {
      try {
        const [sitesRes, siteRes] = await Promise.all([
          fetch('/api/shield/sites').then(r => r.json()),
          fetch('/api/shield/sites/' + state.selectedSiteId).then(r => r.json())
        ]);
        if (sitesRes.sites) state.sites = sitesRes.sites;
        if (siteRes.ok) state.siteData = siteRes;
        render();
      } catch (e) {}
    }

    async function switchSite(siteId) {
      state.selectedSiteId = siteId;
      state.diagResult = null;
      await loadAllData();
    }

    async function runSecurityAudit() {
      state.runningDiag = true;
      state.diagResult = null;
      render();
      try {
        const res = await fetch('/api/shield/diagnose/' + state.selectedSiteId, { method: 'POST' }).then(r => r.json());
        state.diagResult = res.result;
        await loadAllData();
      } catch (err) {
        alert('Diagnostic probe failed: ' + err.message);
      } finally {
        state.runningDiag = false;
        render();
      }
    }

    async function resolveError(errorId) {
      try {
        await fetch('/api/shield/errors/' + errorId + '/resolve', { method: 'POST' });
        await loadAllData();
      } catch (e) {}
    }

    async function addNewSite(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/shield/sites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.newSiteForm)
        }).then(r => r.json());
        if (res.ok && res.site) {
          state.showAddSiteModal = false;
          state.selectedSiteId = res.site.client_id;
          state.newSiteForm = {
            site_name: '',
            site_url: '',
            category: 'E-Commerce & Food Hospitality',
            environment: 'production',
            sla_target: '99.95',
            alert_email: ''
          };
          await loadAllData();
        } else {
          alert(res.error || 'Failed to register site');
        }
      } catch (err) {
        alert('Failed to connect: ' + err.message);
      }
    }

    // Main Master Render
    function render() {
      const app = document.getElementById('app');

      if (!state.authenticated) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-[#090B10]">
            <div class="w-full max-w-md bg-[#11151F] border border-[#232B3E] rounded-lg p-8 shadow-2xl relative">
              <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 mb-3">
                  <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white uppercase font-mono">SAJAMA SHIELD</h1>
                <p class="text-[11px] uppercase tracking-widest text-amber-500 font-semibold mt-1">Autonomous Observability & Security SaaS</p>
                <p class="text-xs text-slate-400 mt-2 font-mono">Head Office Command Operations Terminal</p>
              </div>

              ${state.loginError ? `
                <div class="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-md text-rose-400 text-xs flex items-center gap-2 font-mono">
                  <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                  <span>${state.loginError}</span>
                </div>
              ` : ''}

              <form onsubmit="login(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1 font-mono">Master Shield Key</label>
                  <input
                    type="password"
                    value="${state.authKey}"
                    oninput="state.authKey = this.value"
                    placeholder="Enter Master Key"
                    required
                    class="w-full bg-[#090B10] border border-[#232B3E] rounded-md px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono transition"
                  />
                  <p class="text-[11px] text-slate-500 mt-1 font-mono">Default master key: <span class="text-amber-400 font-bold">sajama2026</span></p>
                </div>

                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1 font-mono">Operator Identity</label>
                  <input
                    type="text"
                    value="${state.engineerName}"
                    oninput="state.engineerName = this.value"
                    placeholder="e.g. Lead DevOps Specialist"
                    required
                    class="w-full bg-[#090B10] border border-[#232B3E] rounded-md px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono transition"
                  />
                </div>

                <button
                  type="submit"
                  class="w-full mt-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 px-4 rounded-md text-xs uppercase tracking-wider font-mono transition flex items-center justify-center gap-2 cursor-pointer shadow-sm"
                >
                  <i data-lucide="lock" class="w-4 h-4"></i>
                  <span>Authenticate Command Console</span>
                </button>
              </form>

              <div class="mt-6 pt-4 border-t border-[#232B3E] text-center">
                <span class="text-[11px] text-slate-400 font-mono inline-flex items-center gap-1.5">
                  <i data-lucide="shield" class="w-3.5 h-3.5 text-emerald-400"></i>
                  100% Ghana Data Protection Act 2012 (Act 843) Compliant (Zero PII)
                </span>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const activeSite = (state.sites && state.sites.find(s => s.client_id === state.selectedSiteId)) || (state.sites && state.sites[0]) || {
        site_name: 'Client Application',
        site_url: 'https://example.com',
        client_id: state.selectedSiteId,
        uptime_percentage: 99.98,
        avg_latency_ms: 28,
        health_score: 99,
        security_score: 'A+',
        ssl_days_remaining: 82,
        live_visitors: 12
      };

      const siteData = state.siteData || {};
      const vitals = siteData.web_vitals || {
        ttfb: { value_ms: 28, status: 'good' },
        fcp: { value_ms: 680, status: 'good' },
        lcp: { value_ms: 1120, status: 'good' },
        cls: { value: 0.004, status: 'good' },
        inp: { value_ms: 38, status: 'good' }
      };

      app.innerHTML = `
        <!-- Top Command Header -->
        <header class="no-print bg-[#11151F] border-b border-[#232B3E] sticky top-0 z-40">
          <div class="max-w-[1720px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
            <!-- Left: Brand & Telemetry Indicator -->
            <div class="flex items-center gap-3 shrink-0">
              <div class="w-7 h-7 rounded-md bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center font-bold">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
              </div>
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-white tracking-wider text-sm font-mono">SAJAMA SHIELD</span>
                <span class="text-[10px] font-bold font-mono px-1.5 py-0.5 rounded bg-amber-500 text-slate-950 uppercase tracking-widest">COMMAND</span>
                <span class="text-xs text-slate-600 font-mono">|</span>
                <span id="utc-clock" class="text-xs font-mono text-slate-400 hidden lg:inline-block">${new Date().toUTCString().replace('GMT', 'UTC')}</span>
              </div>
            </div>

            <!-- Center: Multi-Tenant Switcher -->
            <div class="flex items-center gap-2 flex-1 max-w-lg mx-2">
              <div class="relative w-full">
                <i data-lucide="globe" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <select
                  onchange="switchSite(this.value)"
                  class="w-full bg-[#090B10] border border-[#232B3E] rounded-md pl-9 pr-8 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-amber-500 appearance-none cursor-pointer"
                >
                  ${state.sites.map(s => `
                    <option value="${s.client_id}" ${s.client_id === state.selectedSiteId ? 'selected' : ''}>
                      [${s.uptime_percentage}% SLA] ${s.site_name} (${s.client_id})
                    </option>
                  `).join('')}
                </select>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              </div>

              <button
                onclick="state.showAddSiteModal = true; render();"
                title="Enroll New Client Site"
                class="shrink-0 px-2.5 py-1.5 bg-[#161B26] hover:bg-slate-800 border border-[#232B3E] rounded-md text-xs font-mono text-slate-300 hover:text-white transition flex items-center gap-1"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Add Site</span>
              </button>
            </div>

            <!-- Right: Action Buttons & Probe Status -->
            <div class="flex items-center gap-2">
              <button
                onclick="state.showSnippetModal = true; render();"
                class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-[#161B26] hover:bg-slate-800 border border-[#232B3E] rounded-md text-xs font-mono text-slate-200 transition"
              >
                <i data-lucide="code" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>Client Tag</span>
              </button>

              <button
                onclick="runSecurityAudit()"
                disabled="${state.runningDiag}"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-slate-950 rounded-md text-xs font-bold font-mono uppercase tracking-wider transition cursor-pointer shadow-sm"
              >
                <i data-lucide="${state.runningDiag ? 'loader-2' : 'zap'}" class="w-3.5 h-3.5 ${state.runningDiag ? 'animate-spin' : ''}"></i>
                <span>${state.runningDiag ? 'Auditing...' : 'Live Probe'}</span>
              </button>

              <button
                onclick="logout()"
                title="Sign out of Command Console"
                class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-md transition ml-1"
              >
                <i data-lucide="log-out" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Secondary Sub-Navigation Tabs -->
          <div class="max-w-[1720px] mx-auto px-4 sm:px-6 border-t border-[#232B3E] flex overflow-x-auto custom-scroll">
            <nav class="flex space-x-1 py-1">
              ${[
                { id: 'mission_control', label: 'Mission Control & Topology', icon: 'radar' },
                { id: 'security', label: 'Security & Threat Radar', icon: 'shield-alert' },
                { id: 'vitals', label: 'Core Web Vitals & Routes', icon: 'gauge' },
                { id: 'errors', label: 'Exception Radar', icon: 'bug', badge: state.errors.filter(e => e.status !== 'resolved').length },
                { id: 'funnels', label: 'Conversion & Funnels', icon: 'trending-up' },
                { id: 'reports', label: 'Executive Client Audit', icon: 'file-text', highlight: true },
                { id: 'logs', label: 'Telemetry Stream', icon: 'terminal' }
              ].map(tab => `
                <button
                  onclick="state.activeTab = '${tab.id}'; render();"
                  class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-mono font-semibold whitespace-nowrap transition cursor-pointer ${
                    state.activeTab === tab.id
                      ? tab.highlight ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-[#232B3E] text-white shadow-sm'
                      : tab.highlight ? 'text-amber-400 hover:bg-amber-500/10' : 'text-slate-400 hover:text-slate-200 hover:bg-[#161B26]'
                  }"
                >
                  <i data-lucide="${tab.icon}" class="w-3.5 h-3.5"></i>
                  <span>${tab.label}</span>
                  ${tab.badge ? `<span class="px-1.5 py-0.2 rounded text-[10px] bg-rose-500 text-white font-mono">${tab.badge}</span>` : ''}
                </button>
              `).join('')}
            </nav>
          </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-[1720px] w-full mx-auto px-4 sm:px-6 py-5 space-y-5">
          ${renderTabContent(activeSite, siteData, vitals)}
        </main>

        <!-- Modals -->
        ${state.showAddSiteModal ? renderAddSiteModal() : ''}
        ${state.showSnippetModal ? renderSnippetModal(activeSite) : ''}
      `;

      lucide.createIcons();
    }

    function renderTabContent(activeSite, siteData, vitals) {
      if (state.activeTab === 'mission_control') return renderMissionControlTab(activeSite, siteData, vitals);
      if (state.activeTab === 'security') return renderSecurityTab(activeSite, siteData);
      if (state.activeTab === 'vitals') return renderVitalsTab(activeSite, siteData, vitals);
      if (state.activeTab === 'errors') return renderErrorsTab(activeSite);
      if (state.activeTab === 'funnels') return renderFunnelsTab(activeSite, siteData);
      if (state.activeTab === 'reports') return renderReportsTab(activeSite);
      if (state.activeTab === 'logs') return renderLogsTab();
      return renderMissionControlTab(activeSite, siteData, vitals);
    }

    // 1. MISSION CONTROL & TOPOLOGY TAB (THE ULTIMATE COMMAND SCREEN)
    function renderMissionControlTab(site, data, vitals) {
      const probeNodes = state.probeNodes.length > 0 ? state.probeNodes : [
        { id: 'accra_edge_01', name: 'Accra Edge (Adabraka / Ridge)', latency_ms: 18, jitter_ms: 0.8, status: 'operational', packet_loss: '0.00%', x: 280, y: 190 },
        { id: 'kumasi_edge_02', name: 'Kumasi Node (Ahodwo Gateway)', latency_ms: 24, jitter_ms: 1.1, status: 'operational', packet_loss: '0.00%', x: 260, y: 175 },
        { id: 'lagos_edge_03', name: 'Lagos Gateway (Victoria Island)', latency_ms: 32, jitter_ms: 1.4, status: 'operational', packet_loss: '0.00%', x: 320, y: 195 },
        { id: 'london_gw_01', name: 'London Transit (Equinix LD4)', latency_ms: 82, jitter_ms: 2.1, status: 'operational', packet_loss: '0.00%', x: 270, y: 80 },
        { id: 'frankfurt_gw_02', name: 'Frankfurt Core (DE-CIX)', latency_ms: 88, jitter_ms: 2.4, status: 'operational', packet_loss: '0.00%', x: 295, y: 90 },
        { id: 'virginia_us_01', name: 'US East Edge (N. Virginia)', latency_ms: 114, jitter_ms: 3.2, status: 'operational', packet_loss: '0.00%', x: 140, y: 110 },
      ];

      return `
        <!-- Live Status Bar -->
        <div class="bg-[#11151F] border border-[#232B3E] rounded-lg p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              <span class="text-xs font-mono font-bold text-white uppercase">${site.site_name}</span>
            </div>
            <span class="text-xs text-slate-500 font-mono">|</span>
            <span class="text-xs font-mono text-slate-400">URL: <a href="${site.site_url}" target="_blank" class="text-amber-400 hover:underline">${site.site_url}</a></span>
            <span class="text-xs text-slate-500 font-mono">|</span>
            <span class="text-xs font-mono text-slate-400">Environment: <strong class="text-emerald-400 uppercase">${site.environment || 'PRODUCTION'}</strong></span>
            <span class="text-xs text-slate-500 font-mono">|</span>
            <span class="text-xs font-mono text-slate-400">Category: <strong class="text-white">${site.category || 'E-Commerce'}</strong></span>
          </div>

          <div class="flex items-center gap-3">
            <a
              href="/status/${site.client_id}"
              target="_blank"
              class="px-3 py-1.5 bg-[#161B26] hover:bg-slate-800 border border-[#232B3E] rounded-md text-xs font-mono text-slate-300 transition flex items-center gap-1.5"
            >
              <i data-lucide="radio" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>Client Status URL</span>
            </a>
            <button
              onclick="state.activeTab = 'reports'; render();"
              class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold font-mono text-xs rounded-md uppercase tracking-wider transition flex items-center gap-1.5 cursor-pointer shadow-sm"
            >
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
              <span>Generate Audit PDF</span>
            </button>
          </div>
        </div>

        <!-- 4 Key Telemetry Metrics -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- 1. SLA Uptime -->
          <div class="bg-[#11151F] border border-[#232B3E] rounded-lg p-4">
            <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-2">
              <span class="uppercase tracking-wider">30-Day SLA Uptime</span>
              <span class="text-emerald-400 font-bold">TARGET: ${site.sla_target || 99.95}%</span>
            </div>
            <div class="flex items-baseline gap-2">
              <span class="text-2xl font-bold font-mono text-emerald-400">${site.uptime_percentage}%</span>
              <span class="text-[11px] font-mono text-slate-400">0.00% Packet Loss</span>
            </div>
            <div class="w-full bg-[#161B26] h-1.5 mt-3 rounded-none overflow-hidden">
              <div class="bg-emerald-500 h-full" style="width: ${Math.min(site.uptime_percentage, 100)}%"></div>
            </div>
          </div>

          <!-- 2. Edge Response Time -->
          <div class="bg-[#11151F] border border-[#232B3E] rounded-lg p-4">
            <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-2">
              <span class="uppercase tracking-wider">Edge TTFB / Latency</span>
              <span class="text-amber-400 font-bold font-mono">ACCRA NODE</span>
            </div>
            <div class="flex items-baseline gap-2">

                    <th class="py-2 px-3">Monthly Hits</th>

    // 4. ERROR RADAR TAB
    function renderErrorsTab(site) {
      return `
        <div class="space-y-5">
          <div class="bg-[#11151F] border border-[#232B3E] rounded-lg p-5 flex items-center justify-between">
            <div>
              <h3 class="text-xs font-bold font-mono text-white uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="bug" class="w-4 h-4 text-rose-500"></i>
                Client Runtime Exception & Stack Trace Radar
              </h3>
              <p class="text-xs font-mono text-slate-400 mt-1">Automatic fingerprint grouping of uncaught browser errors</p>
            </div>
            <span class="text-xs font-mono font-bold px-2.5 py-1 bg-[#090B10] text-slate-300 border border-[#232B3E] rounded">
              ${state.errors.length} Anomalies Logged
            </span>
          </div>

          <div class="space-y-3 font-mono">
            ${state.errors.length === 0 ? `
              <div class="p-12 text-center bg-[#11151F] border border-[#232B3E] rounded-lg">
                <i data-lucide="check-circle" class="w-8 h-8 text-emerald-400 mx-auto mb-2"></i>
                <h4 class="text-xs font-bold text-white uppercase">Zero Active Runtime Errors</h4>
                <p class="text-[11px] text-slate-400 mt-1">Client frontend running with 100% clean execution.</p>
              </div>
            ` : state.errors.map(err => `
              <div class="bg-[#11151F] border border-[#232B3E] rounded-lg p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div class="space-y-1 flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-1.5 py-0.2 rounded text-[10px] font-bold ${err.status === 'resolved' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                      ${err.error_type}
                    </span>
                    <span class="text-xs text-slate-400">${err.filename}:${err.lineno}</span>
                    <span class="text-xs text-amber-400 font-bold">${err.occurrences} hits</span>
                  </div>
                  <p class="text-xs text-slate-200 font-bold truncate">${err.message}</p>
                  <p class="text-[10px] text-slate-500">Last seen: ${new Date(err.last_seen).toLocaleString('en-GB')}</p>

                <div>
                  ${err.status === 'resolved' ? `
                    <span class="text-xs text-emerald-400 font-bold inline-flex items-center gap-1">
                      <i data-lucide="check" class="w-3.5 h-3.5"></i> RESOLVED

                    <button
                      onclick="resolveError(${err.id})"

                      Mark Resolved
                    </button>
                  `}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

        { step: '1. Landing Pageview', visitors: 1240, dropoff: '0.0%' },
        { step: '2. Catalog / Menu Browse', visitors: 980, dropoff: '21.0%' },
        { step: '3. Add To Cart / Item Selection', visitors: 420, dropoff: '57.1%' },
        { step: '4. Initiate Checkout', visitors: 310, dropoff: '26.2%' },
        { step: '5. Order Placed / Payment Verified', visitors: 265, dropoff: '14.5%' },
      ];

      return `
        <div class="space-y-5">
          <div class="bg-[#11151F] border border-[#232B3E] rounded-lg p-5">
            <h3 class="text-xs font-bold font-mono text-white uppercase tracking-wider mb-4 flex items-center gap-2">
              <i data-lucide="trending-up" class="w-4 h-4 text-amber-500"></i>
              Client Business Intelligence & Conversion Funnel Waterfall
            </h3>

            <div class="space-y-3 font-mono">
              ${funnel.map((f, idx) => {
                const pct = Math.max(15, Math.round((f.visitors / funnel[0].visitors) * 100));
                return `
                  <div class="p-3 bg-[#090B10] border border-[#232B3E] rounded space-y-1.5">
                    <div class="flex justify-between text-xs">
                      <span class="text-slate-200 font-bold">${f.step}</span>
                      <div class="flex items-center gap-3">
                        <span class="text-slate-400">${f.visitors} sessions</span>
                        ${idx > 0 ? `<span class="text-rose-400 text-[11px]">-${f.dropoff} drop-off</span>` : ''}
                      </div>
                    </div>
                    <div class="w-full bg-[#161B26] h-3 overflow-hidden rounded">
                      <div class="bg-amber-500 h-full" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

                <div>
                  <h3 class="text-xs font-bold text-white uppercase">Executive Infrastructure Assessment</h3>
                  <p class="text-xs text-slate-300 font-sans">${rep.executive_summary.overall_verdict}</p>

                    <div class="flex justify-between items-center mb-1">
                      <span class="text-xs text-slate-400">${sc.category}</span>
                      <span class="text-emerald-400 font-bold">${sc.grade}</span>

                    <div class="text-lg font-bold text-white">${sc.score}</div>
                    <p class="text-[10px] text-slate-500 mt-1">${sc.status}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Strategic Action Plan -->
            <div>
              <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Actionable Technical & Business Recommendations</h3>
              <div class="space-y-2.5">
                ${rep.actionable_recommendations.map(rec => `
                  <div class="p-3 bg-[#090B10] border border-[#232B3E] rounded flex items-start gap-3">
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase mt-0.5 ${rec.priority === 'High' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' : 'bg-blue-500/10 text-blue-400 border border-blue-500/30'}">

            <select
              onchange="state.logSeverity = this.value; render();"
              class="bg-[#090B10] border border-[#232B3E] rounded px-3 py-1 text-xs font-mono text-slate-300 focus:outline-none"
            >
              <option value="ALL">ALL SEVERITIES</option>
              <option value="INFO">INFO</option>
              <option value="WARN">WARN</option>
              <option value="CRITICAL">CRITICAL</option>

          <div class="bg-[#090B10] border border-[#232B3E] rounded-lg p-3 font-mono text-xs space-y-1.5 max-h-[520px] overflow-y-auto custom-scroll">

                <div class="p-2 bg-[#11151F] border border-[#232B3E] rounded flex items-start gap-2.5">
                  <span class="text-slate-500 text-[10px] shrink-0">${new Date(l.logged_at).toLocaleTimeString('en-GB')}</span>

                  }">${l.severity}</span>
                  <span class="text-amber-400 font-bold shrink-0">${l.subsystem}</span>
                  <span class="text-slate-300 flex-1">${l.message}</span>
                </div>
              `).join('')}
          </div>
        </div>
      `;
    }

    // Modal: Diagnostic Banner
    function renderDiagnosticBanner(diag) {
      return `

          <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px] pt-2 border-t border-emerald-500/20 text-slate-300">
            <div><span>SSL Protocol:</span> <strong class="text-white">${diag.ssl_status.protocol}</strong></div>
            <div><span>HTTP Code:</span> <strong class="text-white">${diag.status_code} OK</strong></div>

              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-slate-300 mb-1">Category</label>
                  <select
                    value="${state.newSiteForm.category}"

          <div class="bg-[#11151F] border border-[#232B3E] rounded-lg max-w-lg w-full p-6 shadow-2xl relative font-mono">

    init();
